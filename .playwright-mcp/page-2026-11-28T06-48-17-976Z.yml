          - code [ref=f1e492]: "{ \"merchantKey\": \"your_merchant_key\", \"secretKey\": \"your_secret_key\", \"orderId\": \"YOUR-UNIQUE-ORDER-ID\", \"amount\": \"200.00\", \"callbackUrl\": \"https://your-server.com/webhooks/astropay/withdraw\", \"account\": \"TXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\" }"
          - paragraph [ref=f1e493]:
            - text: Note
            - code [ref=f1e494]: accountType
            - text: is not present at all in the body —
            - code [ref=f1e495]: bank_code
            - text: ","
            - code [ref=f1e496]: accountPhone
            - text: ", and"
            - code [ref=f1e497]: personName
            - text: can also be safely omitted for USDT.
          - paragraph [ref=f1e498]:
            - text: The request fails with
            - code [ref=f1e499]: "400"
            - text: (“insufficient balance”) if
            - code [ref=f1e500]: amount
            - text: + our commission exceeds your current available balance — check
            - strong [ref=f1e501]: Account → Balance and Dashboard Summary
            - text: first if you’re unsure.
          - heading "Response (success)" [level=2] [ref=f1e502]:  Response (success)
          - code [ref=f1e504]: "{ \"code\": 1000, \"data\": { \"orderId\": \"YOUR-UNIQUE-ORDER-ID\", \"amount\": \"200.00\", \"commission\": 14, \"netAmount\": 214, \"utr\": \"\", \"status\": 1 }, \"msg\": \"success\" }"
          - paragraph [ref=f1e505]:
            - code [ref=f1e506]: status
            - text: is always
