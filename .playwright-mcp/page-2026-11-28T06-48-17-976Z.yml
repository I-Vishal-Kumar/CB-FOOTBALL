          - heading "Example — INR / UPI payout (secondary)" [level=3] [ref=f1e471]:  Example — INR / UPI payout (secondary)
          - paragraph [ref=f1e472]:
            - text: Use this only when a UPI VPA is all you hold for the beneficiary. UPI payout availability is
