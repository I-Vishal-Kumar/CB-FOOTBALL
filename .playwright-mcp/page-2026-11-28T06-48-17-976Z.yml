            - text: and
            - strong [ref=f1e475]: no order is created
            - text: .
            - code [ref=f1e476]: BANK
            - text: payouts are unaffected, so prefer
            - code [ref=f1e477]: BANK
            - text: wherever you have an account number and IFSC.
