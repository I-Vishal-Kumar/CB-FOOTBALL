          - heading "Create Withdrawal Order" [level=1] [ref=f1e388]:  Create Withdrawal Order
          - paragraph [ref=f1e389]:
            - code [ref=f1e390]: POST /v1/payouts/create
          - paragraph [ref=f1e391]:
            - text: Creates a payment order that sends money out of your AstroPay balance to a bank account, mobile wallet, or USDT address, depending on
            - code [ref=f1e392]: accountType
            - text: .
          - paragraph [ref=f1e393]:
            - strong [ref=f1e394]: This endpoint enforces the IP whitelist strictly
            - text: — make sure the server IP you call from is on file with support before going live.
          - blockquote [ref=f1e395]:
            - paragraph [ref=f1e396]:
              - strong [ref=f1e397]:
                - text: For INR, use
                - code [ref=f1e398]: BANK
                - text: .
              - text: Bank transfer (account number + IFSC) is the primary, fully supported INR payout method and the one to build your integration against.
              - code [ref=f1e399]: UPI
              - text: is a secondary option whose availability is not guaranteed — see
              - strong [ref=f1e400]: Reference → Payment Method Codes
              - text: .
          - heading [level=2] [ref=f1e401]:
            - text:  Request (INR
            - code [ref=f1e402]: BANK
            - text: — primary method)
