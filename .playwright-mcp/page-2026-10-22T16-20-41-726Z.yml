      - generic [ref=e26]:
        - heading "AstroPay Merchant API" [level=1] [ref=e27]:  AstroPay Merchant API
        - paragraph [ref=e28]: This is the server-to-server integration API for merchants — used to create collection (deposit) and payment (withdrawal) orders, check their status, check your balance, and receive real-time settlement webhooks. Everything in this documentation uses simple API-key authentication in the request body.
        - heading "Base URL" [level=2] [ref=e29]:  Base URL
        - code [ref=e31]: https://api.gpay.one
        - paragraph [ref=e32]:
          - text: All endpoints in this documentation are relative to this base, e.g.
          - code [ref=e33]: POST https://api.gpay.one/v1/payins/create
          - text: .
        - heading "Authentication" [level=2] [ref=e34]:  Authentication
        - paragraph [ref=e35]:
          - text: Every request is a
          - code [ref=e36]: POST
          - text: with a JSON body (
          - code [ref=e37]: "Content-Type: application/json"
          - text: ) that includes your credentials directly in the body — there is no
          - code [ref=e38]: Authorization
          - text: "header and no per-request request-signing:"
        - code [ref=e40]: "{ \"merchantKey\": \"your_merchant_key\", \"secretKey\": \"your_secret_key\" }"
        - list [ref=e41]:
          - listitem [ref=e42]:
            - strong [ref=e43]: merchantKey / secretKey
            - text: — issued when your account is provisioned. Treat
            - code [ref=e44]: secretKey
            - text: "like a password: it is also used to verify webhook signatures (see the Webhooks section)."
          - listitem [ref=e45]:
            - strong [ref=e46]: IP whitelisting is required.
            - text: Requests from an IP not on your account’s whitelist are rejected with
            - code [ref=e47]: "403"
            - text: . Send us the IP(s) your integration calls from during onboarding.
          - listitem [ref=e48]:
            - text: Your account has
            - strong [ref=e49]: one fixed settlement currency
            - text: (e.g. INR, PKR, BDT, or USDT) set when it was provisioned. You never pass a currency parameter — every amount you send or receive is in your account’s currency.
        - heading "Response envelope" [level=2] [ref=e50]:  Response envelope
        - paragraph [ref=e51]: "Every endpoint returns the same JSON shape:"
        - code [ref=e53]: "{ \"code\": 1000, \"data\": { \"...\": \"...\" }, \"msg\": \"success\" }"
        - list [ref=e54]:
          - listitem [ref=e55]:
            - code [ref=e56]: "code: 1000"
            - text: always means success.
          - listitem [ref=e57]:
            - text: Any other
            - code [ref=e58]: code
            - text: is a business/validation error. The HTTP status code mirrors it when it falls in the 400–599 range, otherwise the response is sent as HTTP 500.
          - listitem [ref=e59]:
            - code [ref=e60]: data
            - text: is
            - code [ref=e61]: "null"
            - text: on error.
          - listitem [ref=e62]:
            - code [ref=e63]: msg
            - text: is a human-readable message — it may occasionally be in Chinese for lower-level internal errors, so match on
            - code [ref=e64]: code
            - text: in your integration, not on the text of
            - code [ref=e65]: msg
            - text: .
        - paragraph [ref=e66]:
          - text: See
          - strong [ref=e67]: Reference → Status & Error Codes
          - text: for the full list.
        - heading "Order status values" [level=2] [ref=e68]:  Order status values
        - paragraph [ref=e69]: "Both deposit and withdrawal orders move through the same three states:"
        - table [ref=e71]:
          - rowgroup [ref=e72]:
            - row [ref=e73]:
              - columnheader "status" [ref=e74]
              - columnheader "meaning" [ref=e75]
