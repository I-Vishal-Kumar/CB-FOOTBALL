            - row [ref=e81]:
              - cell [ref=e82]:
                - code [ref=e83]: "9"
              - cell "Failed" [ref=e84]
            - row [ref=e85]:
              - cell [ref=e86]:
                - code [ref=e87]: "10"
              - cell "Success (settled)" [ref=e88]
        - heading "Idempotency" [level=2] [ref=e89]:  Idempotency
        - paragraph [ref=e90]:
          - code [ref=e91]: orderId
          - text: is
          - strong [ref=e92]: your own
          - text: order reference (a string you generate) and must be unique per order on your side. Creating an order with an
          - code [ref=e93]: orderId
          - text: you’ve already used will be treated as a fresh order by these endpoints — always generate a new, unique
          - code [ref=e94]: orderId
          - text: per attempt.
        - heading "Webhooks aren’t retried automatically" [level=2] [ref=e95]:  Webhooks aren’t retried automatically
        - paragraph [ref=e96]:
          - text: When an order settles, we POST a webhook to the
          - code [ref=e97]: callbackUrl
          - text: you supplied at creation time (see
          - strong [ref=e98]: Webhooks
          - text: ). If your endpoint is briefly down and misses it, there is currently no automatic retry loop — a human has to manually resend it from our side.
          - strong [ref=e99]: Don’t rely on the webhook alone
          - text: ": poll"
          - code [ref=e100]: /v1/payins/query
          - text: /
          - code [ref=e101]: /v1/payouts/query
          - text: periodically for any order still
          - code [ref=e102]: "status: 1"
          - text: after a reasonable window, and treat the webhook as the fast path rather than the only path.
